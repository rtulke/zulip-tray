[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zulip-tray"
version = "0.4.3"
description = "GNOME system-tray client for Zulip: presence icon, desktop notifications, status"
license = "MIT"
authors = [{ name = "Robert Tulke", email = "rt@debian.sh" }]
requires-python = ">=3.11"
# GTK, AppIndicator, libnotify and libsecret come from the distro via
# GObject-Introspection (python3-gi + gir1.2-* packages, see
# packaging/nfpm.yaml) -- there is deliberately no PyGObject wheel here:
# that is what keeps the .deb tiny and distro-independent. Create the dev
# venv with --system-site-packages so `import gi` resolves.
dependencies = [
    "requests",
]

[project.urls]
Repository = "https://github.com/rtulke/zulip-tray/"

[project.scripts]
zulip-tray = "zulip_tray.main:main"
zulip-tray-send = "zulip_tray.cli:main"

[tool.setuptools.packages.find]
include = ["zulip_tray*"]

[tool.setuptools.package-data]
zulip_tray = ["resources/icons/*.svg", "resources/sounds/*.wav"]

[tool.pytest.ini_options]
testpaths = ["tests"]
