name: Release

# test+build+verify run on every push/PR to main so breakage is caught
# early; the release job only fires on an actual "vX.Y.Z" tag push.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NFPM_VERSION: "2.47.0"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install GTK/GI runtime and pytest
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            python3-gi gir1.2-gtk-3.0 gir1.2-ayatanaappindicator3-0.1 gir1.2-notify-0.7 gir1.2-secret-1 \
            python3-requests python3-pytest xvfb
      - name: Run unit tests (under a virtual display for the GTK parts)
        run: xvfb-run -a python3 -m pytest -q

  build:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - name: Install build prerequisites
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git python3 curl ca-certificates rsync
      - uses: actions/checkout@v7
      - name: Determine package version
        id: version
        run: |
          VERSION=$(python3 -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('zulip_tray/__init__.py').read()).group(1))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Stage the package tree
        run: mkdir -p stage && rsync -a --exclude="__pycache__" zulip_tray/ stage/zulip_tray/
      - name: Install nfpm
        run: |
          curl -sSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
            -o /tmp/nfpm.tar.gz
          tar -xzf /tmp/nfpm.tar.gz -C /usr/local/bin nfpm
          chmod +x /usr/local/bin/nfpm
      - name: Build .deb
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
        run: nfpm package -f packaging/nfpm.yaml -p deb -t "zulip-tray_${PKG_VERSION}_all.deb"
      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: zulip-tray_*.deb
          if-no-files-found: error

  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: debian12
            image: debian:12
          - id: debian13
            image: debian:13
          - id: ubuntu2404
            image: ubuntu:24.04
          - id: ubuntu2604
            image: ubuntu:26.04
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - name: Install git for checkout
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: deb
      # A real `apt-get install`, not `dpkg -i`, so the declared dependencies
      # must resolve against this distro's archive -- the point of the matrix.
      - name: Install the package the same way an end user would
        run: DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ./zulip-tray_*.deb
      - name: Smoke-test the installed package
        run: bash packaging/verify-installed.sh

  release:
    needs: [test, verify]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: deb
          path: artifacts
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          sha256sum *.deb > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "Zulip Tray $GITHUB_REF_NAME" \
            * \
          || gh release upload "$GITHUB_REF_NAME" * \
            --repo "$GITHUB_REPOSITORY" --clobber
